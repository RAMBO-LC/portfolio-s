services:
  - type: web
    name: portfolio
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: client/dist
    pullRequestPreviewsEnabled: true
    # HashRouter is used (see client/main.jsx), so no SPA rewrite rule is
    # needed — all routes stay behind /#/ and resolve to /index.html.
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
    headers:
      # Vite emits hashed filenames -> safe to cache immutably for a year
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
